name: ci
on:
  push:
    branches: [master]
  pull_request:
  # release.yml runs these checks before it builds a tagged release.
  workflow_call:
permissions:
  contents: read
# Each job runs one group of ci/check.sh, which holds the commands; the jobs
# only install what the group needs and run in parallel.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sh ci/check.sh lint-and-test

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: sh ci/check.sh msrv

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo install --locked cargo-machete --version 0.9.2
      - run: sh ci/check.sh dependencies
