name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag is released only after the same checks as a push to master.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # The toolchain of rust-toolchain.toml, plus the musl target.
      - run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p chip
      - run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/chip dist/chip-x86_64-unknown-linux-musl
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
