# Copy to the workspace root. CI runs `cargo deny --locked check`.
# Install: cargo install --locked cargo-deny

[graph]
# The shipped Linux target and the development target.
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = true

[advisories]
# Vulnerabilities from the RustSec database always fail the check. Unmaintained
# and unsound crates are reported anywhere in the graph; yanked versions fail.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# The lists cover many projects; an entry unused in this one is not an error.
unused-allowed-license = "allow"
unused-license-exception = "allow"
# Other licenses are allowed only for a known crate, so a new dependency under
# MPL, OpenSSL or NCSA stops CI until it is reviewed.
exceptions = [
    # Cryptography provider of rustls.
    { allow = ["OpenSSL"], crate = "aws-lc-sys" },
    # Dependency of `dirs`.
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Fuzzing harness.
    { allow = ["NCSA"], crate = "libfuzzer-sys" },
]

[licenses.private]
# Workspace crates have `publish = false` and no license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between private workspace crates have no version.
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "TLS goes through rustls; lift this ban only in a project that needs OpenSSL" },
    { crate = "native-tls", reason = "TLS goes through rustls; lift this ban only in a project that needs OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
