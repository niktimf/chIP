# The shipped Linux target and the development target.
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = true

[advisories]

[licenses]
# Existing dependency licenses, approved as the initial project policy.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
# Report duplicate transitive versions; no project-specific crate banlist.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
