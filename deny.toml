# Dependency policy of the workspace. `sh ci/check.sh dependencies` runs
# `cargo deny --locked check` with it; ci.yml pins the cargo-deny version.

[graph]
# The shipped Linux target and the development target.
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
all-features = true

[advisories]
# Vulnerabilities from the RustSec database always fail the check. Unmaintained
# and unsound crates are reported anywhere in the graph; yanked versions fail.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8
# The allow list holds permissive licenses that no current dependency uses
# yet, so a dependency update under one of them needs no change here.
unused-allowed-license = "allow"
# Any other license (MPL, OpenSSL, NCSA) is allowed only for a reviewed crate
# through an `exceptions` entry. None is needed: no crate of Cargo.lock uses
# such a license.
exceptions = []

[licenses.private]
# Workspace crates have `publish = false` and no license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between private workspace crates have no version.
allow-wildcard-paths = true
deny = [
    { crate = "openssl-sys", reason = "TLS goes through rustls, and the musl release binary builds without a system OpenSSL" },
    { crate = "native-tls", reason = "TLS goes through rustls, and the musl release binary builds without a system OpenSSL" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
